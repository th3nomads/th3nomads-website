name: Apply private gallery thumbnail

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Patch homepage through GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os, json, base64, urllib.request

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPO']
          api = f'https://api.github.com/repos/{repo}/contents'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'th3nomads-gallery-updater'
          }

          def request(url, method='GET', data=None):
              body = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(url, data=body, method=method, headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read().decode()) if r.length != 0 else {}

          file_data = request(f'{api}/index.html?ref=main')
          text = base64.b64decode(file_data['content']).decode()
          old = '''<a href="#contact">
<div class="client-gallery-image"><img alt="Wedding client gallery cover" loading="lazy" src="assets/images/wedding-07.jpg"/></div>
<div class="client-gallery-info"><div><p>Private Collections</p><h3>Find Your Gallery</h3><small>Request your link</small></div><span>Contact Us ↗</span></div>
</a>'''
          new = '''<a href="galleries/">
<div class="client-gallery-image" style="display:grid;place-items:center;background:#111;color:#c9a85d;font:400 clamp(2rem,4vw,4rem) Georgia,'Times New Roman',serif;letter-spacing:-.02em;text-align:center;padding:24px;">Private Gallery</div>
<div class="client-gallery-info"><div><p>Private Collections</p><h3>Find Your Gallery</h3><small>Enter your gallery access name</small></div><span>Open Gallery ↗</span></div>
</a>'''
          if old not in text:
              raise SystemExit('Expected private gallery card block was not found')
          updated = text.replace(old, new, 1)
          request(f'{api}/index.html', 'PUT', {
              'message': 'Replace private gallery thumbnail with text',
              'content': base64.b64encode(updated.encode()).decode(),
              'sha': file_data['sha'],
              'branch': 'main'
          })

          wf_path = '.github/workflows/apply-private-gallery-thumbnail.yml'
          wf = request(f'{api}/{wf_path}?ref=main')
          request(f'{api}/{wf_path}', 'DELETE', {
              'message': 'Remove temporary gallery updater',
              'sha': wf['sha'],
              'branch': 'main'
          })
          PY
