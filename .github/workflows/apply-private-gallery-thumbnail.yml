name: Apply private gallery thumbnail

on:
  push:
    branches:
      - private-gallery-thumbnail

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: private-gallery-thumbnail
      - name: Replace private gallery thumbnail
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '''<a href="#contact">
<div class="client-gallery-image"><img alt="Wedding client gallery cover" loading="lazy" src="assets/images/wedding-07.jpg"/></div>
<div class="client-gallery-info"><div><p>Private Collections</p><h3>Find Your Gallery</h3><small>Request your link</small></div><span>Contact Us ↗</span></div>
</a>'''
          new = '''<a href="galleries/">
<div class="client-gallery-image" style="display:grid;place-items:center;background:#111;color:#c9a85d;font:400 clamp(2rem,4vw,4rem) Georgia,'Times New Roman',serif;letter-spacing:-.02em;text-align:center;padding:24px;">Private Gallery</div>
<div class="client-gallery-info"><div><p>Private Collections</p><h3>Find Your Gallery</h3><small>Enter your gallery access name</small></div><span>Open Gallery ↗</span></div>
</a>'''
          if old not in s:
              raise SystemExit('Expected private gallery card block was not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Remove temporary workflow and commit change
        run: |
          git rm .github/workflows/apply-private-gallery-thumbnail.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Replace private gallery thumbnail with text"
          git push origin HEAD:private-gallery-thumbnail
