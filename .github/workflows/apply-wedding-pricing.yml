name: Apply wedding pricing update
on:
  push:
    paths:
      - '.github/workflows/apply-wedding-pricing.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update wedding pricing and coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          reps={
          'Photography only · Starting at <strong>$850</strong>':'Photography only · Starting at <strong>$600</strong>',
          'Starting at $1,450</strong><small>Coordinated photo and video coverage with a 2–3 minute cinematic highlight film.':'Starting at $1,200</strong><small>Coordinated photo and video coverage with a 2–3 minute cinematic highlight film.',
          'Photography only · Starting at <strong>$1,650</strong>':'Photography only · Starting at <strong>$950</strong>',
          'Starting at $2,700</strong><small>Coordinated photo and video coverage with a 4–5 minute cinematic highlight film.':'Starting at $1,900</strong><small>Coordinated photo and video coverage with a 4–5 minute cinematic highlight film.',
          'Photography only · Starting at <strong>$2,200</strong>':'Photography only · Starting at <strong>$1,200</strong>',
          'Starting at $3,600</strong><small>Coordinated photo and video coverage with a 5–7 minute cinematic highlight film.':'Starting at $2,400</strong><small>Coordinated photo and video coverage with a 5–7 minute cinematic highlight film.',
          'Full Story — up to 8 hours':'Full Story — up to 7 hours','<li>Up to 8 hours</li>':'<li>Up to 7 hours</li>'}
          for a,b in reps.items():
              assert a in s,a; s=s.replace(a,b)
          a='<li>Up to 6 hours</li><li>350+ edited photos</li><li>Timeline guidance</li><li>Pre- or post-wedding shoot included</li><li>Private online gallery</li>'
          b='<li>Up to 6 hours</li><li>350+ edited photos</li><li>Timeline guidance</li><li>Private online gallery</li>'
          assert a in s; s=s.replace(a,b,1); p.write_text(s)
          p=Path('script.js'); s=p.read_text()
          reps={"'Full Story — up to 8 hours'":"'Full Story — up to 7 hours'","'Intimate — up to 3 hours': { photo: 850, video: 1450, content: 1200 }":"'Intimate — up to 3 hours': { photo: 600, video: 1200, content: 1200 }","'Signature — up to 6 hours': { photo: 1650, video: 2700, content: 2300 }":"'Signature — up to 6 hours': { photo: 950, video: 1900, content: 2300 }","'Full Story — up to 7 hours': { photo: 2200, video: 3600, content: 3100 }":"'Full Story — up to 7 hours': { photo: 1200, video: 2400, content: 3100 }","'Full Story — up to 7 hours':8":"'Full Story — up to 7 hours':7"}
          for a,b in reps.items(): assert a in s,a; s=s.replace(a,b)
          p.write_text(s)
          PY
      - name: Verify and commit
        run: |
          grep -q "'Full Story — up to 7 hours': { photo: 1200, video: 2400" script.js
          test "$(grep -o 'Pre- or post-wedding shoot included' index.html | wc -l)" -eq 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html script.js
          git commit -m 'Update wedding package pricing and coverage'
          git push
