name: Apply Signature wedding coverage update
on:
  push:
    paths:
      - '.github/workflows/apply-wedding-pricing.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set Signature wedding package to 5 hours
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()
          old = 'Signature — up to 6 hours'
          assert old in s, old
          s = s.replace(old, 'Signature — up to 5 hours')

          # Change only the Signature wedding card's coverage line.
          marker = '<p class="package-label">Signature</p>'
          start = s.index(marker)
          end = s.index('</div>', start)
          block = s[start:end]
          assert '<li>Up to 6 hours</li>' in block
          block = block.replace('<li>Up to 6 hours</li>', '<li>Up to 5 hours</li>', 1)
          s = s[:start] + block + s[end:]
          p.write_text(s)

          p = Path('script.js')
          s = p.read_text()
          assert 'Signature — up to 6 hours' in s
          s = s.replace('Signature — up to 6 hours', 'Signature — up to 5 hours')
          assert "'Signature — up to 5 hours':6" in s
          s = s.replace("'Signature — up to 5 hours':6", "'Signature — up to 5 hours':5")
          p.write_text(s)
          PY
      - name: Verify and commit
        run: |
          grep -q 'Signature — up to 5 hours' index.html
          grep -q "'Signature — up to 5 hours':5" script.js
          ! grep -q 'Signature — up to 6 hours' index.html
          ! grep -q 'Signature — up to 6 hours' script.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html script.js
          git commit -m 'Set Signature wedding package to 5 hours'
          git push
