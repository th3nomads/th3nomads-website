name: Rebalance photography package pricing
on:
  push:
    paths:
      - '.github/workflows/apply-wedding-pricing.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebalance package cards and estimator
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()
          replacements = {
            '<strong>Starting at $1,200</strong><small>Photo coverage, social-ready vertical clips, and one edited highlight reel.</small>':'<strong>Starting at $950</strong><small>Photo coverage, social-ready vertical clips, and one edited highlight reel.</small>',
            '<strong>Starting at $2,300</strong><small>Photo coverage, social-ready vertical clips, and two edited highlight reels.</small>':'<strong>Starting at $1,500</strong><small>Photo coverage, social-ready vertical clips, and two edited highlight reels.</small>',
            '<strong>Starting at $3,100</strong><small>Full photo coverage, an extended vertical clip collection, and three edited highlight reels.</small>':'<strong>Starting at $1,900</strong><small>Full photo coverage, an extended vertical clip collection, and three edited highlight reels.</small>',
            '<p class="package-label">Complete Event</p><h4>Photography only · Starting at <strong>$1,100</strong></h4>':'<p class="package-label">Complete Event</p><h4>Photography only · Starting at <strong>$850</strong></h4>',
            '<strong>Starting at $2,000</strong><small>Coordinated coverage with a 4–5 minute cinematic event highlight film.</small>':'<strong>Starting at $1,700</strong><small>Coordinated coverage with a 4–5 minute cinematic event highlight film.</small>',
            '<strong>Starting at $1,750</strong><small>Full photo coverage, an extended vertical clip collection, and three edited event reels.</small>':'<strong>Starting at $1,400</strong><small>Full photo coverage, an extended vertical clip collection, and three edited event reels.</small>',
            'Additional photography coverage: $150/hour':'Additional photography coverage: $200/hour'
          }
          for old,new in replacements.items():
              if old in s:
                  s = s.replace(old,new,1)
          p.write_text(s)

          p = Path('script.js')
          s = p.read_text()
          replacements = {
            'const ADDITIONAL_HOUR_RATE = 150;':'const ADDITIONAL_HOUR_RATE = 200;',
            "'Intimate — up to 3 hours': { photo: 600, video: 1200, content: 1200 }":"'Intimate — up to 3 hours': { photo: 600, video: 1200, content: 950 }",
            "'Signature — up to 5 hours': { photo: 950, video: 1900, content: 2300 }":"'Signature — up to 5 hours': { photo: 950, video: 1900, content: 1500 }",
            "'Full Story — up to 7 hours': { photo: 1200, video: 2400, content: 3100 }":"'Full Story — up to 7 hours': { photo: 1200, video: 2400, content: 1900 }",
            "'Complete Event — up to 5 hours': { photo: 1100, video: 2000, content: 1750 }":"'Complete Event — up to 5 hours': { photo: 850, video: 1700, content: 1400 }"
          }
          for old,new in replacements.items():
              if old in s:
                  s = s.replace(old,new,1)
          p.write_text(s)

          # Guardrail: every photo + content bundle must remain below the matching
          # photo + videography bundle. Fail deployment if a future edit violates it.
          import re
          rows = re.findall(r"'([^']+)': \{ photo: (\d+), video: (\d+), content: (\d+) \}", s)
          violations = [(name,int(video),int(content)) for name,photo,video,content in rows if int(content) >= int(video)]
          if violations:
              raise SystemExit(f'Content pricing must stay below videography pricing: {violations}')
          PY
      - name: Verify and commit
        run: |
          grep -q 'Additional photography coverage: $200/hour' index.html
          grep -q 'Complete Event</p><h4>Photography only · Starting at <strong>$850' index.html
          grep -q "content: 950" script.js
          grep -q "content: 1500" script.js
          grep -q "content: 1900" script.js
          grep -q "photo: 850, video: 1700, content: 1400" script.js
          grep -q 'const ADDITIONAL_HOUR_RATE = 200;' script.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html script.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Rebalance photography package pricing'
          git push
